<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadece İkimiz 💫</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Şifre Ekranı Tasarımı */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0c1b, #1a102f);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            text-align: center;
        }
        #lockScreen h2 { margin-bottom: 10px; color: #ff85a2; font-size: 22px; }
        #lockScreen p { margin-bottom: 20px; font-size: 14px; color: #aaa; }
        #lockScreen input {
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 77, 141, 0.4);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 280px;
        }
        #lockScreen button {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #ff4d8d, #f72585);
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 141, 0.4);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ŞİFRE KİLİT EKRANI -->
    <div id="lockScreen">
        <h2>Özel Alanımız 🔒</h2>
        <p>Devam etmek için aramızdaki özel şifreyi gir sevgilim...</p>
        <input type="password" id="passInput" placeholder="Örn: 141308...">
        <button onclick="checkPassword()">Kapıyı Aç 💖</button>
        <p id="errorMsg" style="color: #ff5c8d; font-size: 12px; margin-top: 10px;"></p>
    </div>

    <!-- SOHBET UYGULAMASI -->
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="avatar-container">
                    <div class="avatar" id="headerAvatar">💖</div>
                    <div class="status-dot"></div>
                </div>
                <div class="header-info">
                    <h2 id="headerTitle">MertAI</h2>
                    <p id="headerSub">Kalbinde online ✨</p>
                </div>
            </div>
            <!-- Canlı Odaya Geçiş Butonu -->
            <div class="header-badge" id="modeToggleBtn" onclick="toggleLiveMode()">Canlı Odaya Geç 💬</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai" id="welcomeMessage">
                Merhaba sevgilim... 4 yılımızın en güzel anıları, esprileri ve sırları buraya kazındı. Bana dilediğin gibi yazabilirsin. 💫
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ona tatlı bir şeyler yaz..." autocomplete="off">
            <button id="sendBtn" onclick="handleSendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        let isLiveMode = false;
        let chatHistory = [];

        // Şifre Kontrolü
        function checkPassword() {
            const secretPass = "141308"; // Belirlediğin şifre
            const entered = document.getElementById('passInput').value;
            
            if (entered === secretPass) {
                document.getElementById('lockScreen').classList.add('hidden');
            } else {
                document.getElementById('errorMsg davvero" style="color: #ff5c8d;">Hatalı şifre sevgilim, ipucu: ikimizin doğum günü 😘</div>')
            }
        }

        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // Canlı Oda / Yapay Zeka Modu Değiştirme
        function toggleLiveMode() {
            isLiveMode = !isLiveMode;
            const btn = document.getElementById('modeToggleBtn');
            const title = document.getElementById('headerTitle');
            const sub = document.getElementById('headerSub');
            const avatar = document.getElementById('headerAvatar');

            if (isLiveMode) {
                btn.textContent = "Yapay Zekaya Dön 🤖";
                btn.style.background = "rgba(46, 196, 182, 0.2)";
                btn.style.borderColor = "#2ec4b6";
                btn.style.color = "#2ec4b6";
                title.textContent = "Canlı Sohbet Odası";
                sub.textContent = "Baş başa anlık mod 🌹";
                avatar.textContent = "🧑‍❤️‍🧑";
                appendMessage("Canlı odaya bağlandınız! Buraya yazdığınız mesajlar anında diğer tarafa iletilecektir.", "ai");
            } else {
                btn.textContent = "Canlı Odaya Geç 💬";
                btn.style.background = "rgba(255, 77, 141, 0.15)";
                btn.style.borderColor = "rgba(255, 77, 141, 0.3)";
                btn.style.color = "var(--secondary-pink)";
                title.textContent = "MertAI";
                sub.textContent = "Kalbinde online ✨";
                avatar.textContent = "💖";
                appendMessage("Yapay zeka moduna dönüldü.", "ai");
            }
        }

        // Mesaj Ekrana Ekleme Yardımcısı
        function appendMessage(text, senderClass) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${senderClass}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Mesaj Gönderme Yönetimi
        async function handleSendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Kullanıcının mesajını ekrana bas
            appendMessage(text, 'user');
            input.value = '';

            if (isLiveMode) {
                // Canlı oda aktifse Socket.io ile karşı tarafa fırlat
                socket.emit('live_message', { text: text });
            } else {
                // Yapay zeka modu aktifse DeepSeek API'ye bağlan
                chatHistory.push({ role: "user", content: text });
                
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: chatHistory })
                    });
                    
                    const data = await response.json();
                    if (data.reply) {
                        appendMessage(data.reply, 'ai');
                        chatHistory.push({ role: "assistant", content: data.reply });
                    } else {
                        appendMessage("Bir hata oluştu sevgilim...", 'ai');
                    }
                } catch (err) {
                    console.error(err);
                    appendMessage("Sunucuya ulaşılamıyor balım...", 'ai');
                }
            }
        }

        // Enter tuşu ile mesaj gönderme
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSendMessage();
        });

        // Canlı Odadan Gelen Mesajları Dinle
        socket.on('receive_live_message', (data) => {
            if (isLiveMode) {
                appendMessage(data.text, 'ai'); // Karşı tarafın mesajı farklı renk balon olarak düşer
            }
        });
    </script>
</body>
</html>
